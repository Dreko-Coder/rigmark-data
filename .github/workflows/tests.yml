# Runs the fixture tests on pull requests. No collection, no signing key, no network request to any shop.
name: tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install age (for the evidence encryption test)
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Tests (stored fixtures only)
        env:
          RIGMARK_REQUIRE_DOTNET: "1"
          RIGMARK_REQUIRE_AGE: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: python -m unittest discover -s tests -v
